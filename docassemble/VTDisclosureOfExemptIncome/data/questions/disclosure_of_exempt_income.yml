---
id: Intro
question: |
  Intro
continue button field: Intro
---
id: Your name
question: |
  Your name
fields:
  - "Your name": users1_name_1
    maxlength: 30
---
id: Your address
question: |
  Your address
fields:
  - "Your address 1st line": users1_address_first_line
    maxlength: 37
  - "Your address 2nd line": users1_address_second_line
    maxlength: 20
---
id: Exempt income from the state of Vermont
question: |
  Exempt income from the state of Vermont
fields:
  - "Do you have exempt income from the state?": has_exempt_income_state
    datatype: yesno
  - "Do you have exempt income from DCF?": has_exempt_income_state_DCF
    datatype: yesno
  - "Do you have exempt income from DVHA?": has_exempt_income_state_DVHA
    datatype: yesno
---
id: Other sources of exempt income
question: |
  Other sources of exempt income
fields:
  - "You have one of the following other sources of exempt income": has_exempt_income_other
    datatype: yesno
  - "Do you have exempt income from Social Security?": has_exempt_income_other_SS
    datatype: yesno
  - "Do you have exempt income from SSDI?": has_exempt_income_other_SSDI
    datatype: yesno
  - "Do you have exempt income from the VA?": has_exempt_income_other_VA
    datatype: yesno
  - "Do you have exempt income from unemployment?": has_exempt_income_other_unemployment
    datatype: yesno
  - "Do you have exempt income from workers comp?": has_exempt_income_other_workers_comp
    datatype: yesno
---
id: Financial disclosure affidavit
question: |
  Financial disclosure affidavit
fields:
  - "Do you want to fill out a financial disclosure affidavit?": wants_to_fill_out_financial_disclosure
    datatype: yesno
---
id: Other reasons why your income is exempt
question: |
  Other reasons why your income is exempt
fields:
  - "Are there other reasons why your income is exempt?": otherwise_exempt
    datatype: yesno
  - "Explain the other reasons why your income is exempt": otherwise_exempt_description
    input type: area
    maxlength: 316
---
