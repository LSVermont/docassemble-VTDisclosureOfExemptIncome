---
# ALDocument objects specify the metadata for each template
objects:
  - disclosure_of_exempt_income_Post_interview_instructions: ALDocument.using(title="Instructions", filename="disclosure_of_exempt_income_next_steps.docx", enabled=True, has_addendum=False)
  - disclosure_of_exempt_income_attachment: ALDocument.using(title="Disclosure of exempt income", filename="disclosure_of_exempt_income", enabled=True, has_addendum=False, )
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[disclosure_of_exempt_income_Post_interview_instructions, disclosure_of_exempt_income_attachment], filename="disclosure_of_exempt_income", title="All forms to download for your records", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[disclosure_of_exempt_income_attachment],  filename="disclosure_of_exempt_income", title="All forms to deliver to court", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: disclosure_of_exempt_income_next_steps
  docx template file: disclosure_of_exempt_income_next_steps.docx
  variable name: disclosure_of_exempt_income_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: disclosure of exempt income
  filename: disclosure_of_exempt_income
  variable name: disclosure_of_exempt_income_attachment[i]
  skip undefined: True
  pdf template file: disclosure_of_exempt_income.pdf
  fields:
      - "trial_court_county": ${ trial_court.address.county }
      - "docket_number": ${ docket_number }
      - "other_parties1_name": ${ other_parties[0] }
      - "users1_name": ${ users[0] }
      - "has_exempt_income_state": ${ has_exempt_income_state }
      - "has_exempt_income_state_DCF": ${ has_exempt_income_state_DCF }
      - "has_exempt_income_state_DVHA": ${ has_exempt_income_state_DVHA }
      - "has_exempt_income_other": ${ has_exempt_income_other }
      - "has_exempt_income_other_SS": ${ has_exempt_income_other_SS }
      - "has_exempt_income_other_SSDI": ${ has_exempt_income_other_SSDI }
      - "has_exempt_income_other_VA": ${ has_exempt_income_other_VA }
      - "has_exempt_income_other_unemployment": ${ has_exempt_income_other_unemployment }
      - "has_exempt_income_other_workers_comp": ${ has_exempt_income_other_workers_comp }
      - "wants_to_fill_out_financial_disclosure": ${ wants_to_fill_out_financial_disclosure }
      - "otherwise_exempt": ${ otherwise_exempt }
      - "otherwise_exempt_description": ${ otherwise_exempt_description }
      # It's a signature: test which file version this is; leave empty unless it's the final version)
      - "signature": ${ signature if i == "final" else '' }
      - "users1_signature": ${ users[0].signature_if_final(i) }
      - "signature_date": ${ signature_date }
      - "users1_name_discl_exempt_inc": ${ users[0] }
      - "users1_address_first_line": ${ users[0].address.line_one() }
      - "users1_address_second_line": ${ users[0].address.line_two() }
      - "users1_mailing_address": ${ users[0].mailing_address.on_one_line() }



