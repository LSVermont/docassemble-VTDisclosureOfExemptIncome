  - Edit: has_exempt_income_other_SS
    button: |
      **Do you have exempt income from Social Security?**:
      ${ word(yesno(has_exempt_income_other_SS)) }
  - Edit: has_exempt_income_other_SSDI
    button: |
      **Do you have exempt income from SSDI?**:
      ${ word(yesno(has_exempt_income_other_SSDI)) }
  - Edit: has_exempt_income_other_VA
    button: |
      **Do you have exempt income from the VA?**:
      ${ word(yesno(has_exempt_income_other_VA)) }
  - Edit: has_exempt_income_other_unemployment
    button: |
      **Do you have exempt income from unemployment?**:
      ${ word(yesno(has_exempt_income_other_unemployment)) }
  - Edit: has_exempt_income_other_workers_comp
    button: |
      **Do you have exempt income from workers comp?**:
