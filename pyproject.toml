[build-system]
requires = [
    "setuptools>=80.9.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "docassemble.VTDisclosureOfExemptIncome"
version = "1.1"
description = "Disclosure of exempt income"
readme = "README.md"
dependencies = [
    "docassemble.AssemblyLine @ git+https://github.com/SuffolkLITLab/docassemble-AssemblyLine.git@main",
    "docassemble.VTFeedback @ git+https://github.com/VTskier/docassemble-VTFeedback.git@main",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[[project.authors]]
name = "Kris Surette, VTCourtForms, Legal Services Vermont"
email = "ksurette@legalservicesvt.org"

[project.urls]
Homepage = "https://VTLawHelp.org"

[tool.setuptools.packages.find]
where = [
    ".",
]
